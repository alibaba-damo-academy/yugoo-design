[package]
edition = "2024"
name = "yugoo_design_git_native"
version = "0.1.0-beta.2"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
libgit2-sys = { version = "*", default-features = false, features = ["vendored"] }
home = "0.5"
once_cell = "1"

[dependencies.napi]
version = "3.0"
default-features = false
features = ["async", "chrono_date", "napi6", "dyn-symbols"]

[dependencies.napi-derive]
version = "3.0"

[target.'cfg(all(target_os = "linux", target_env = "gnu", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
dirs = "6"

[target.'cfg(all(target_os = "linux", target_env = "gnu", target_arch = "x86_64"))'.dependencies]
libz-sys = { version = "1", features = ["static"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
