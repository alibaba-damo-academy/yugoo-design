version: 1
panel_kind: evidence_workbook
i18n:
  default_locale: zh-CN
  locales: {zh-CN: locales/zh-CN.json, en-US: locales/en-US.json}
empty_description: $t:empty
sections:
  - id: processes
    title: $t:processes
    item_name: $t:process
    order: process_order
    add_mode: none
    form:
      reorder: false
      header: {variant: detail, title: {field: title, editable: false}}
      body:
        - {kind: field, field: description}
        - kind: row
          items:
            - {kind: field, field: tier, width: fill}
            - {kind: field, field: process_type, width: fill}
        - {kind: field, field: stakeholders}
        - {kind: field, field: business_rules}
        - {kind: field, field: trigger_hints}
        - {kind: field, field: exception_handling}
  - id: nodes
    title: $t:nodes
    item_name: $t:node
    order: node_order
    add_mode: none
fields:
  - {key: title, label: '$t:title', control: text, readonly: true, applies_to: [processes]}
  - {key: description, label: '$t:description', control: textarea, readonly: true, applies_to: [processes]}
  - key: tier
    label: $t:tier
    control: select
    readonly: true
    options: [{value: core, label: '$t:core'}, {value: business, label: '$t:business'}, {value: auxiliary, label: '$t:auxiliary'}]
    applies_to: [processes]
  - key: process_type
    label: $t:type
    control: select
    readonly: true
    options: [{value: linear, label: '$t:linear'}, {value: approval, label: '$t:approval'}, {value: parallel, label: '$t:parallel'}, {value: event_driven, label: '$t:event'}]
    applies_to: [processes]
  - {key: stakeholders, label: '$t:actors', control: token_list, readonly: true, applies_to: [processes]}
  - {key: business_rules, label: '$t:rules', description: '$t:flowConstraintsHelp', control: list, readonly: true, applies_to: [processes]}
  - key: trigger_hints
    label: $t:triggers
    control: rows
    readonly: true
    hide_when_empty: true
    row_name: $t:trigger
    applies_to: [processes]
    columns:
      - key: kind
        label: $t:kind
        control: select
        options: [{value: timer, label: '$t:timer'}, {value: message, label: '$t:message'}, {value: error, label: '$t:error'}, {value: conditional, label: '$t:conditional'}, {value: signal, label: '$t:signal'}]
      - {key: trigger, label: '$t:trigger', control: text}
      - {key: expected_outcome, label: '$t:outcome', control: text}
  - key: exception_handling
    label: $t:exceptions
    control: rows
    readonly: true
    hide_when_empty: true
    row_name: $t:exception
    applies_to: [processes]
    columns:
      - {key: scenario, label: '$t:scenario', control: text}
      - {key: handling, label: '$t:handling', control: text}
  - {key: bpmn_file, label: '$t:diagram', control: artifact_ref, hidden: true, readonly: true, applies_to: [processes]}
  - {key: process_ref, label: '$t:process', control: record_select, options_from_section: processes, hidden: true, readonly: true, applies_to: [nodes]}
  - {key: bpmn_element_ref, label: '$t:elementRef', control: text, hidden: true, readonly: true, applies_to: [nodes]}
  - {key: activity, label: '$t:activity', control: textarea, applies_to: [nodes]}
  - {key: entry_condition, label: '$t:entryCondition', control: textarea, applies_to: [nodes]}
  - {key: exit_condition, label: '$t:exitCondition', control: textarea, applies_to: [nodes]}
  - {key: failure_response, label: '$t:nodeException', control: textarea, applies_to: [nodes]}
  - {key: remarks, label: '$t:remarks', control: textarea, applies_to: [nodes]}
ui:
  component: diagram_workspace
  sidebar_icon: workflow
  id: process-diagrams
  title: $t:processes
  source: processes
  diagram:
    format: bpmn
    file_field: bpmn_file
    label_field: title
    artifact_kind: flow_bpmn
    order_only: true
    summary_fields: [description]
    detail_rows: [[description], [stakeholders], [business_rules], [tier, process_type], [trigger_hints], [exception_handling]]
    chip_fields: [stakeholders]
    detail_hint_fields: [business_rules, exception_handling]
    inspector:
      presentation: document
      process_sections: [processes]
      nodes:
        source: nodes
        process_field: process_ref
        element_field: bpmn_element_ref
        label_field: activity
        sections: [nodes]
      migration:
        message: $t:nodeMigrationMessage
        action_label: $t:nodeMigrationAction
        prompt: $t:nodeMigrationPrompt
