  </style></head><body class="prd-document"><main class="prd-container"><header class="prd-header"><h1 class="prd-title">合成 PRD 排版示例</h1><p class="prd-subtitle">仅演示报告阅读，不是用户需求或模型执行结果。</p></header><h2 data-prd-section-id="product_definition" data-prd-sources="user" data-prd-provenance-ids="">产品定义</h2><p>这里用短段落演示背景、目标与边界。标题用于定位，正文用于表达判断，空白用于分组。</p><h2 data-prd-section-id="capability_architecture" data-prd-sources="user" data-prd-provenance-ids="">功能与行为</h2><h3>功能示例</h3><p>真实规格需要有来源的场景、动作、结果和异常；此页不补造业务决策。</p><h2 data-prd-section-id="assembly_traceability" data-prd-sources="user" data-prd-provenance-ids="">来源与待确认</h2><p>真实文档可以从章节来源返回原设计。此页是隔离的合成排版样例。</p></main></body></html>
