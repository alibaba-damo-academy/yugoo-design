<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{REPORT_TITLE}}</title>
  <style data-report-document-style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #171717; font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 40px; overflow-wrap: anywhere; }
    header { margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid #d4d4d4; }
    h1 { margin: 0 0 6px; font-size: 20px; line-height: 1.4; font-weight: 700; }
    h2 { margin: 24px 0 10px; font-size: 16px; line-height: 1.5; font-weight: 700; }
    h3, h4 { margin: 16px 0 8px; font-size: 14px; line-height: 1.6; font-weight: 650; }
    p { margin: 0 0 12px; }
    ul, ol { margin: 0 0 14px; padding-left: 24px; }
    li { margin: 6px 0; }
    a { color: #1d4ed8; text-underline-offset: 2px; }
    table { width: 100%; margin: 16px 0 22px; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 9px 10px; border: 1px solid #d4d4d4; text-align: left; vertical-align: top; }
    th { background: #f5f5f5; }
    figure { margin: 16px 0 24px; }
    figure img, figure svg { display: block; max-width: 100%; height: auto; }
    figcaption, .report-context { color: #525252; font-size: 12px; }
    .report-takeaway { font-size: 16px; line-height: 1.5; font-weight: 650; }
    .report-answer { margin: 16px 0 24px; padding: 12px 16px; border-left: 3px solid #2563eb; background: #eff6ff; }
    .report-answer .report-label { color: #1d4ed8; }
    .report-answer .report-takeaway { color: #1e3a8a; }
    .report-answer > :last-child { margin-bottom: 0; }
    .report-label { display: block; margin: 0 0 8px; color: #525252; font-size: 12px; font-weight: 650; }
    .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px 24px; margin: 16px 0; }
    .report-grid > section { min-width: 0; padding-top: 12px; border-top: 1px solid #d4d4d4; }
    .report-grid > .report-observation { border-top-color: #2563eb; }
    .report-observation .report-label { color: #1d4ed8; }
    .report-grid h3 { margin-top: 0; }
    .report-grid > section > :last-child { margin-bottom: 0; }
    .report-diagram { overflow-x: auto; padding: 8px 0; }
    .report-diagram svg { max-width: none; margin: 0 auto; }
    .report-diagram:focus-visible { outline: 2px solid #171717; outline-offset: -2px; }
    .report-flow { display: grid; grid-template-columns: 1fr; gap: 28px; padding: 0; list-style: none; }
    .report-flow > li { position: relative; margin: 0; padding: 12px; border: 1px solid #d4d4d4; border-radius: 8px; }
    .report-flow > li:not(:last-child)::after { content: "↓"; position: absolute; left: 12px; bottom: -25px; color: #737373; }
    .report-flow strong { display: block; margin-bottom: 6px; }
    .report-flow p { margin: 0; }
    .report-flow .report-context { margin-bottom: 4px; }
    .report-comparison th { white-space: nowrap; }
    .evidence-limit, .design-suggestion { margin: 12px 0; padding: 10px 14px; border-left: 3px solid; }
    .evidence-limit { border-left-color: #d97706; background: #fffbeb; }
    .evidence-limit > strong { color: #92400e; }
    .design-suggestion { border-left-color: #0f766e; background: #f0fdfa; }
    .design-suggestion .report-label { color: #0f766e; }
    @media (max-width: 720px) { main { width: calc(100% - 28px); padding-top: 16px; } table { display: block; overflow-x: auto; } }
    @media print { main { width: 100%; padding: 0; } figure { break-inside: avoid; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>{{REPORT_TITLE}}</h1>
    <p class="report-context">{{RESEARCH_QUESTION}}</p>
  </header>
  <!-- Compose from this round's accepted evidence; remove this comment.
       Start with the bounded answer (optional report-answer / report-takeaway).
       Choose a comparison or mechanism that explains the consequential point.
       Keep observations, interpretations and suggestions explicit in words;
       report-label / report-grid / evidence-limit / design-suggestion are
       optional semantic reading patterns, not required cards or sections.
       report-flow expresses only a linear sequence. Author meaningful branches
       and return targets explicitly, as illustrated in conclusion-example.html.
       For a wide SVG, use a report-diagram region with tabindex="0", role="region"
       and an accessible name, plus a readable caption and exact source links.
       End with practical implications and consequential unknowns.
       No finding, chart, card, step or prose-area quota. -->
</main>
</body>
</html>
