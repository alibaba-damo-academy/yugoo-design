<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计关系图 · 实时交互实验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafbfc;color:#414956;font:13px system-ui;display:flex;flex-direction:column;height:100vh;min-height:580px}
header{padding:18px 24px 12px;border-bottom:1px solid #e6e9ed;background:white}h1{font-size:16px;font-weight:600;margin:0 0 14px}
nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,input,select{font:inherit;color:inherit}button,select{border:1px solid #dce0e5;padding:7px 12px;border-radius:6px;background:white;cursor:pointer}button[aria-pressed=true]{background:#ececf6;border-color:#bcb9d5;color:#574f8e}
input[type=search]{width:180px;padding:7px 10px;border:1px solid #dce0e5;border-radius:6px;background:#fafbfc}input[type=range]{width:90px;vertical-align:middle;accent-color:#8075af}label{display:flex;align-items:center;gap:6px;color:#6b7483}
.legend{display:flex;gap:20px;align-items:center;margin-top:12px;font-size:12px;color:#7c8492}.line{display:inline-block;width:24px;vertical-align:middle;margin-right:5px;border-top:2px solid #7188ae}.line.parent{border-top:2px dashed #8793a3}#status{margin-left:auto;color:#7c8492;font-size:12px}#algorithm-note{margin-top:9px;font-size:12px;color:#717b8b}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px}#graph{min-height:300px;min-width:0;position:relative;overflow:hidden}canvas{display:block;touch-action:none}footer{padding:18px;border-left:1px solid #e6e9ed;background:white;min-height:0;overflow:auto}#detail-title{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:12px}#detail-body{font-size:13px;line-height:1.7;color:#626d7e;overflow-wrap:anywhere}.float-tooltip-kap{max-width:380px;white-space:normal!important;font:12px system-ui!important}
.record-picker,.relations{display:grid;gap:6px}.record-choice,.relation-choice{text-align:left;width:100%;white-space:normal;line-height:1.5;padding:10px 12px}.record-choice{border-color:transparent;background:#f6f8fa}.relation-choice{font-weight:500}.relation-choice[aria-expanded=true]{border-color:#7c8cae;background:#f0f4fb}.relation-meta{display:block;font-size:11px;color:#7a8495;font-weight:400;margin-top:4px}.quiet{padding:3px 0;border:0;color:#546f9c;background:none;font-size:12px}.evidence-card{border-left:2px solid #d5deed;padding:8px 10px;margin:10px 0 16px;background:#fafbfd}.evidence-card.chosen{border-color:#496fae;background:#eef3fb}.evidence-choice{text-align:left;font-size:12px;padding:4px 0;border:0;background:none;color:#405f91;line-height:1.5}.endpoint-owner{font-size:11px;color:#7b8493;margin-top:12px}.endpoint-text{color:#354354;margin:3px 0 5px;line-height:1.65}.candidate-note{font-size:11px;color:#7b8493}details{font-size:12px;margin:8px 0}summary{cursor:pointer;color:#657b9c}pre{font:11px/1.6 system-ui;white-space:pre-wrap;overflow-wrap:anywhere}.source-locator{font-size:11px;color:#8992a1}.warning{color:#9c692c}.reading-summary{margin:12px 0}
.back-relations{display:block;border:0;background:none;padding:8px 0;margin:4px 0;color:#546f9c;font-size:12px}.evidence-nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}.evidence-nav button{font-size:12px;padding:4px 8px}button:disabled{opacity:.4;cursor:default}
@media(max-width:700px){header{padding:12px}h1{margin-bottom:10px}.legend{gap:10px;flex-wrap:wrap}footer{padding:10px 12px}#status{margin-left:0}input[type=search]{width:150px}}
@media(max-width:900px){.workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(300px,1fr) 220px}footer{border-left:0;border-top:1px solid #e6e9ed}}
</style>
<header><h1>设计关系图 <span style="font-size:12px;color:#939ba7;font-weight:400">/ 实时交互实验</span></h1>
<nav><select id="algorithm" aria-label="布局算法"><option value="D3">D3 · 实时力导向</option><option value="ForceAtlas2 LinLog">ForceAtlas2 · LinLog</option><option value="fCoSE">fCoSE · 多级布局</option><option value="WebCoLa">WebCoLa · 约束优化</option><option value="ELK Stress">Stress · 全局距离优化</option></select><div><button id="overview">概览</button> <button id="expanded">展开</button></div><input id="search" type="search" placeholder="查找设计内容" aria-label="查找设计内容">
<label>疏密 <input id="spacing" type="range" min="0.7" max="1.6" step="0.1" value="1" aria-label="节点间距"></label>
<select id="node-size" aria-label="节点大小"><option value="uniform">统一大小</option><option value="reach">按关联范围</option></select>
<button id="fit">适应画布</button><button id="reset">重新布局</button><span id="status"></span></nav>
<div class="legend"><span><i class="line"></i>跨记录关联（语义候选）</span><span><i class="line parent"></i>父子包含</span><span>颜色：来源 Bundle</span><span id="reading-note"></span></div><details><summary>布局与节点大小说明</summary><div id="size-note" style="margin-top:8px;color:#717b8b;font-size:12px"></div><div id="algorithm-note" role="status"></div></details></header>
<div class="workspace"><main id="graph" aria-label="可拖拽缩放的设计关系图"></main><footer aria-label="设计关联与依据"><div id="detail-title"></div><div id="detail-body"></div></footer></div>
<script id="graph-data" type="application/json">__GRAPH_DATA__</script><script id="drag-worker-code" type="application/json">__GRAPH_WORKER__</script><script type="module">__GRAPH_SCRIPT__</script></html>
