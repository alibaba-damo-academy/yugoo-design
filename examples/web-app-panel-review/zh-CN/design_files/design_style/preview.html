<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清晰的交付判断</title><link rel="stylesheet" href="./tokens.css"><style>html{font:var(--ds-base-font-size)/var(--ds-line-height) var(--ds-body-font);color:var(--ds-text);background:var(--ds-background)}body{margin:0}header,main,footer{max-width:var(--ds-content-width);margin:auto;padding:var(--ds-space-5)}header{border-bottom:1px solid var(--ds-border)}nav{display:flex;gap:var(--ds-space-4);flex-wrap:wrap}a{color:var(--ds-primary)}h1{font-size:var(--ds-font-size-2xl);line-height:var(--ds-line-height-tight)}h2{font-size:var(--ds-font-size-xl);margin-top:var(--ds-space-6)}h3{font-size:var(--ds-font-size-lg)}p{max-width:var(--ds-content-width)}table{border-collapse:collapse;width:100%;background:var(--ds-surface)}th,td{border-bottom:1px solid var(--ds-border);text-align:left;padding:var(--ds-space-3);vertical-align:top}th{background:var(--ds-muted-surface)}button,input,select,textarea{font:inherit}button{padding:var(--ds-space-2) var(--ds-space-4);margin:var(--ds-space-2);border:1px solid #94a3b8;border-radius:var(--ds-radius-sm);background:var(--ds-surface);color:var(--ds-text);cursor:pointer}button.primary{background:var(--ds-primary);color:var(--ds-surface);border-color:var(--ds-primary)}input,textarea,select{padding:var(--ds-space-2);border:1px solid #94a3b8;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:calc(var(--ds-space-6)*5)}label{display:block;margin:var(--ds-space-4) 0 var(--ds-space-2)}.notice{background:var(--ds-info-surface);padding:var(--ds-space-3);border-left:3px solid var(--ds-primary)}.warning{background:var(--ds-warning-surface);padding:var(--ds-space-3)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--ds-density-gap)}.card{padding:var(--ds-space-4);background:var(--ds-surface);border:1px solid var(--ds-border)}.status{display:inline-block;padding:2px var(--ds-space-2);background:var(--ds-muted-surface);border-radius:var(--ds-radius-sm);font-size:var(--ds-font-size-sm)}.scroll{overflow:auto}code{font-size:var(--ds-font-size-sm);white-space:normal}pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{color:var(--ds-muted)}summary{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ds-focus);outline-offset:3px}@media(max-width:600px){header,main,footer{padding:var(--ds-space-4)}th,td{padding:var(--ds-space-2)}h1{font-size:var(--ds-font-size-xl)}}</style></head><body><header><strong>回环交付 · 合成工作室</strong><h1>清晰的交付判断</h1></header><main><p class="notice">FB-042：新增导出布局会影响原定周五交付，尚待负责人确认。</p><div class="grid"><section class="card"><h2>影响说明</h2><p>设计师对照原约定说明哪些内容改变、哪些保持不变，并指出依赖和缺口。</p><label for="reason">决定依据</label><textarea id="reason">进入负责人确认；没有明确决定前，不给客户发送已承诺交期。</textarea></section><section class="card"><h2>状态与操作</h2><p><span class="status">待负责人确认</span></p><button class="primary">确认安排</button><button>退回补充</button><p class="warning">尚缺成本估算。确认前请补足依据。</p></section></div></main><footer>手工合成的 UI 审阅内容；不是已实现服务、通知发送或实际验收结果。</footer></body></html>
