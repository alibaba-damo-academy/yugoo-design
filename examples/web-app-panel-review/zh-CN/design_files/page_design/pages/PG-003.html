<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>负责人确认安排</title><link rel="stylesheet" href="../../design_style/tokens.css"><style>html{font:var(--ds-base-font-size)/var(--ds-line-height) var(--ds-body-font);color:var(--ds-text);background:var(--ds-background)}body{margin:0}header,main,footer{max-width:var(--ds-content-width);margin:auto;padding:var(--ds-space-5)}header{border-bottom:1px solid var(--ds-border)}nav{display:flex;gap:var(--ds-space-4);flex-wrap:wrap}a{color:var(--ds-primary)}h1{font-size:var(--ds-font-size-2xl);line-height:var(--ds-line-height-tight)}h2{font-size:var(--ds-font-size-xl);margin-top:var(--ds-space-6)}h3{font-size:var(--ds-font-size-lg)}p{max-width:var(--ds-content-width)}table{border-collapse:collapse;width:100%;background:var(--ds-surface)}th,td{border-bottom:1px solid var(--ds-border);text-align:left;padding:var(--ds-space-3);vertical-align:top}th{background:var(--ds-muted-surface)}button,input,select,textarea{font:inherit}button{padding:var(--ds-space-2) var(--ds-space-4);margin:var(--ds-space-2);border:1px solid #94a3b8;border-radius:var(--ds-radius-sm);background:var(--ds-surface);color:var(--ds-text);cursor:pointer}button.primary{background:var(--ds-primary);color:var(--ds-surface);border-color:var(--ds-primary)}input,textarea,select{padding:var(--ds-space-2);border:1px solid #94a3b8;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:calc(var(--ds-space-6)*5)}label{display:block;margin:var(--ds-space-4) 0 var(--ds-space-2)}.notice{background:var(--ds-info-surface);padding:var(--ds-space-3);border-left:3px solid var(--ds-primary)}.warning{background:var(--ds-warning-surface);padding:var(--ds-space-3)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--ds-density-gap)}.card{padding:var(--ds-space-4);background:var(--ds-surface);border:1px solid var(--ds-border)}.status{display:inline-block;padding:2px var(--ds-space-2);background:var(--ds-muted-surface);border-radius:var(--ds-radius-sm);font-size:var(--ds-font-size-sm)}.scroll{overflow:auto}code{font-size:.9em;white-space:normal}pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{color:var(--ds-muted)}summary{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ds-focus);outline-offset:3px}@media(max-width:600px){header,main,footer{padding:var(--ds-space-4)}th,td{padding:var(--ds-space-2)}h1{font-size:var(--ds-font-size-xl)}}</style></head><body><header><strong>回环交付 · 合成工作室</strong><h1>负责人确认安排</h1><nav><a data-prototype-id="nav-PG-001" data-prototype-connection="NAV-PG-003-PG-001" data-prototype-page="PG-001" href="PG-001.html">反馈</a><a data-prototype-id="nav-PG-004" data-prototype-connection="NAV-PG-003-PG-004" data-prototype-page="PG-004" href="PG-004.html">历史记录</a><a data-prototype-id="nav-PG-005" data-prototype-connection="NAV-PG-003-PG-005" data-prototype-page="PG-005" href="PG-005.html">设置</a></nav></header><main><p class="notice">合成交付项 DL-042：周五交付前处理客户修改。已保存的事实、待定决定和 AI 草稿分别呈现。</p><h2>负责人确认</h2><p>FB-042 · F-004 · BR-003 / BR-005</p><form id="decision"><label for="outcome">处理决定</label><select id="outcome"><option>退回补充</option><option>确认安排</option><option>暂缓</option><option>拒绝</option></select><label for="basis">决定依据与下一步</label><textarea id="basis">尚缺第二份参考附件与成本估算。请补充后沿 FB-042 重新提交；原范围中的主页面不变。</textarea><label for="date">确认日期（作出承诺时填写）</label><input id="date" type="date"><p><button class="primary" type="submit">演示确认</button><button type="reset">取消修改</button></p><p id="feedback" role="status"></p></form><a data-prototype-id="back-detail" data-prototype-connection="LINK-PG-003-PG-002" data-prototype-page="PG-002" href="PG-002.html">返回原反馈</a></main><footer>手工合成的 UI 审阅内容；不是已实现服务、通知发送或实际验收结果。</footer><script>document.querySelector("#decision").addEventListener("submit",e=>{e.preventDefault();document.querySelector("#feedback").textContent="仅演示表单反馈：未写入业务服务或设计
