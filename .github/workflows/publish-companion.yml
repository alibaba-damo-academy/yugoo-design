name: Prepare or publish Companion beta

on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional expected version; must match release/companion-version.json'
        required: false
        type: string
      publish:
        description: 'Publish this prepared Companion archive to npm (requires release authorization)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: companion-npm-release
  cancel-in-progress: false

jobs:
  dryrun:
    # This workflow covers only Companion, not the separate DSH package chain.
    # Manual recovery/dry-runs stay available; invalid publication refs fail here.
    if: github.repository == 'alibaba-damo-academy/yugoo-design' && github.event_name == 'workflow_dispatch' && (inputs.publish != true || !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: &companion-env
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    # Both mutually exclusive jobs use the same preparation and archive checks.
    steps: &companion-steps
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.7.0
          run_install: false
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Select the tracked version and skip an existing publication
        id: release
        env:
          EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
          REQUIRE_RELEASE_TAG: ${{ github.job == 'publish' }}
          CHECK_RELEASE_PUBLISHED: ${{ github.job == 'publish' }}
        run: node scripts/prepare-companion-release.mjs select
      - name: Install the explicit OIDC-capable npm CLI
        if: steps.release.outputs.skip != 'true'
        run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org
      - name: Require a version tag for an explicitly requested publication
        if: inputs.publish == true && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo 'Companion publication requires a matching vX.Y.Z-beta.N tag.' >&2
          exit 1
      - name: Require the tagged source to belong to reviewed main history
        if: github.job == 'publish' && steps.release.outputs.skip != 'true'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Resolve the public source lock and install with reviewed build permissions
        if: steps.release.outputs.skip != 'true'
        run: |
          node --version
          pnpm --version
          npm --version
          if [ ! -f pnpm-lock.yaml ]; then
            pnpm install --lockfile-only --strict-peer-dependencies --registry=https://registry.npmjs.org
          fi
          pnpm install --frozen-lockfile --strict-peer-dependencies --registry=https://registry.npmjs.org
      - name: Check release guards
        if: steps.release.outputs.skip != 'true'
        run: node --test scripts/companion-release-ci.test.mjs scripts/known-browser-loader-proof.test.mjs scripts/companion-authoring-material.test.mjs
      - name: Build the current source and pack the exact Companion candidate
        if: steps.release.outputs.skip != 'true'
        id: prepare
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node --import tsx scripts/prepare-companion-release.mjs prepare "$RELEASE_VERSION" "$RUNNER_TEMP/companion-release"
      - name: Check the acquired native materials through Core
        if: steps.release.outputs.skip != 'true'
        env:
          YUGOO_NATIVE_GIT_ARTIFACT_ROOT: ${{ runner.temp }}/companion-release/native-artifacts
        run: node --test scripts/companion-native-git.test.mjs
      - name: Verify the prepared archive against its receipt
        if: steps.release.outputs.skip != 'true'
        id: verify
        run: node scripts/prepare-companion-release.mjs verify "$RUNNER_TEMP/companion-release/release-receipt.json"
      - name: Install and check the same archive on Node 22
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_TARBALL: ${{ steps.verify.outputs.tarball }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/check-companion-node-runtime.mjs "$RELEASE_TARBALL" "$RELEASE_VERSION" "$RUNNER_TEMP/companion-node22"
      - uses: actions/setup-node@v7.1.0
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install and check the same archive on Node 24
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_TARBALL: ${{ steps.verify.outputs.tarball }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/check-companion-node-runtime.mjs "$RELEASE_TARBALL" "$RELEASE_VERSION" "$RUNNER_TEMP/companion-node24"
      - uses: actions/setup-node@v7.1.0
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Publish only the exact prepared archive through npm OIDC
        if: github.job == 'publish' && steps.release.outputs.skip != 'true'
        env:
          RELEASE_TARBALL: ${{ steps.verify.outputs.tarball }}
        run: npm publish "$RELEASE_TARBALL" --access public --tag beta --registry=https://registry.npmjs.org

  publish:
    if: github.repository == 'alibaba-damo-academy/yugoo-design' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Publication deliberately trusts this reviewed job's install/build steps too.
    permissions:
      contents: read
      id-token: write
    env: *companion-env
    steps: *companion-steps
